name: Fork Linux Release

on:
  workflow_dispatch:
  push:
    branches: [dev_new]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - install.sh
      - '.github/workflows/fork-release.yml'

permissions:
  contents: write

concurrency:
  group: fork-linux-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset: linux-64
          - goarch: arm64
            asset: linux-arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Compile
        env:
          GOOS: linux
          CGO_ENABLED: '0'
          GOEXPERIMENT: jsonv2
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -v -o dist/V2bX -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme" -trimpath -ldflags "-s -w -buildid=" .
          cp README.md LICENSE dist/
          cp example/*.json dist/
          curl -fL --retry 3 https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geoip.dat -o dist/geoip.dat
          curl -fL --retry 3 https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat -o dist/geosite.dat
          (cd dist && zip -q -r ../V2bX-${{ matrix.asset }}.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: V2bX-${{ matrix.asset }}
          path: V2bX-${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: V2bX-linux-*
          merge-multiple: true
          path: release-assets
      - name: Verify both Linux packages
        run: |
          test -s release-assets/V2bX-linux-64.zip
          test -s release-assets/V2bX-linux-arm64-v8a.zip
      - name: Create/update rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release-assets/*.zip --clobber
          else
            gh release create latest release-assets/*.zip --target "${GITHUB_SHA}" --title "Latest Linux build" --notes "Rolling Linux builds from dev_new. Rebuilt on relevant code changes."
          fi
      - name: Create/update V1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view V1.0.0 >/dev/null 2>&1; then
            gh release upload V1.0.0 release-assets/V2bX-linux-64.zip release-assets/V2bX-linux-arm64-v8a.zip --clobber
          else
            gh release create V1.0.0 release-assets/V2bX-linux-64.zip release-assets/V2bX-linux-arm64-v8a.zip --target "${GITHUB_SHA}" --title "V1.0.0" --notes "Linux AMD64 and ARM64 builds of the Cosdyan V2bX fork, based on upstream v0.4.0 test-2025.09.20. Source revision: ${GITHUB_SHA}."
          fi
